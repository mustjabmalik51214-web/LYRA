<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYRAMOON AI Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#f0f5ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#1e1b4b',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.6); }
        
        /* Glassmorphism effects */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-effect {
            box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body class="bg-[#090d16] text-slate-100 h-screen flex flex-col font-sans overflow-hidden selection:bg-indigo-500 selection:text-white">

    <!-- Ambient Background Glows -->
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-indigo-600/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-purple-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Header Navigation -->
    <header class="h-16 border-b border-slate-800/80 px-6 flex justify-between items-center z-10 glass-panel">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
                <i class="fa-solid font-bold text-lg fa-wand-magic-sparkles"></i>
            </div>
            <div>
                <h1 class="text-base font-bold bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent flex items-center gap-2">
                    LYRAMOON <span class="text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 uppercase tracking-widest font-semibold">AI Studio</span>
                </h1>
                <p class="text-[11px] text-slate-400">Owner & Founder: <span class="text-slate-300 font-medium">Muhammad Taqi</span></p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button id="downloadBtn" onclick="downloadZip()" class="hidden bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-medium px-4 py-2 rounded-xl text-xs transition duration-200 shadow-lg shadow-emerald-500/20 flex items-center gap-2 active:scale-95">
                <i class="fa-solid fa-file-zipper"></i> Download TAQI.zip
            </button>
        </div>
    </header>

    <!-- Main Workspace Layout -->
    <div class="flex-1 flex overflow-hidden z-10 p-3 gap-3">
        
        <!-- Left Side: Chat Workspace -->
        <div class="w-full md:w-1/3 lg:w-[380px] glass-panel rounded-2xl flex flex-col overflow-hidden border border-slate-800/80 shadow-2xl">
            
            <!-- Chat Header -->
            <div class="p-4 border-b border-slate-800/80 bg-slate-900/40 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-xs font-semibold text-slate-300 tracking-wide uppercase">AI Assistant Prompt</span>
                </div>
                <button onclick="clearChat()" title="Reset Session" class="text-slate-400 hover:text-white text-xs transition">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>

            <!-- Messages Box -->
            <div id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-4">
                <div class="bg-slate-800/40 border border-slate-700/50 p-3.5 rounded-2xl text-xs leading-relaxed text-slate-300 backdrop-blur-md">
                    <div class="flex items-center gap-2 mb-1.5 text-indigo-400 font-semibold">
                        <i class="fa-solid fa-robot"></i> LYRAMOON
                    </div>
                    Salam! Main LYRAMOON hoon. Mujhe batao konsa software ya code banana hai. Main direct working code generate aur update karungi!
                </div>
            </div>

            <!-- Input Box -->
            <div class="p-3 border-t border-slate-800/80 bg-slate-900/60">
                <form id="promptForm" onsubmit="handleSend(event)" class="relative flex items-center">
                    <input type="text" id="userInput" placeholder="Ask LYRAMOON to build or update..." class="w-full bg-slate-950/80 text-slate-100 placeholder-slate-500 pl-4 pr-12 py-3 rounded-xl text-xs border border-slate-800 focus:outline-none focus:border-indigo-500/50 focus:ring-2 focus:ring-indigo-500/20 transition shadow-inner">
                    <button type="submit" id="sendBtn" class="absolute right-1.5 bg-indigo-600 hover:bg-indigo-500 text-white w-8 h-8 rounded-lg flex items-center justify-center transition shadow-md shadow-indigo-600/30 active:scale-95">
                        <i class="fa-solid fa-arrow-up text-xs"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- Right Side: Live Studio Preview & Code Editor -->
        <div class="flex-1 glass-panel rounded-2xl flex flex-col overflow-hidden border border-slate-800/80 shadow-2xl">
            
            <!-- Workspace Tabs Bar -->
            <div class="bg-slate-900/60 border-b border-slate-800/80 px-4 py-2.5 flex justify-between items-center">
                <div class="flex gap-2">
                    <button id="tabPreview" onclick="switchTab('preview')" class="bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 px-3.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 transition">
                        <i class="fa-solid fa-eye text-[11px]"></i> Live Preview
                    </button>
                    <button id="tabCode" onclick="switchTab('code')" class="text-slate-400 hover:text-white px-3.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 transition">
                        <i class="fa-solid fa-code text-[11px]"></i> Source Code
                    </button>
                </div>
                
                <div class="flex items-center gap-2">
                    <span class="text-[11px] text-slate-500 font-mono">Viewport: Desktop</span>
                </div>
            </div>

            <!-- Workspace Output Area -->
            <div class="flex-1 relative bg-[#0b0f19]">
                <!-- Preview Canvas -->
                <div id="previewContainer" class="w-full h-full p-2">
                    <iframe id="previewIframe" class="w-full h-full rounded-xl bg-white border border-slate-800/50 shadow-lg"></iframe>
                </div>

                <!-- Code View -->
                <textarea id="codeView" readonly class="w-full h-full bg-[#0d1117] text-indigo-300 font-mono text-xs p-5 outline-none resize-none hidden border-0 selection:bg-indigo-900"></textarea>
            </div>
        </div>

    </div>

    <script>
        let currentCode = "";

        async function handleSend(e) {
            e.preventDefault();
            const input = document.getElementById("userInput");
            const btn = document.getElementById("sendBtn");
            const prompt = input.value.trim();

            if (!prompt) return;

            appendMessage("User", prompt);
            input.value = "";
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin text-xs"></i>`;

            try {
                const response = await fetch("/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: prompt, current_code: currentCode })
                });

                const data = await response.json();
                
                if (data.code) {
                    currentCode = data.code;
                    appendMessage("LYRAMOON", data.explanation || "App update ho gayi hai! Screen par check karein.");
                    
                    // Render Live Interactive Preview
                    const iframe = document.getElementById("previewIframe");
                    iframe.srcdoc = currentCode;
                    
                    // Update Raw Code Viewer
                    document.getElementById("codeView").value = currentCode;
                    
                    // Display Zip Export Button
                    document.getElementById("downloadBtn").classList.remove("hidden");
                } else {
                    appendMessage("LYRAMOON", data.response || "Koi masla aya hai, dobara try karein.");
                }

            } catch (err) {
                appendMessage("LYRAMOON", "Backend server connection error.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-arrow-up text-xs"></i>`;
            }
        }

        function appendMessage(sender, text) {
            const chatBox = document.getElementById("chatBox");
            const div = document.createElement("div");
            const isUser = sender === "User";
            
            div.className = isUser 
                ? "bg-indigo-600/20 border border-indigo-500/30 ml-auto max-w-[85%] p-3 rounded-2xl text-xs text-indigo-100 shadow-md backdrop-blur-md" 
                : "bg-slate-800/40 border border-slate-700/50 mr-auto max-w-[85%] p-3 rounded-2xl text-xs text-slate-300 shadow-md backdrop-blur-md";
            
            div.innerHTML = `
                <div class="flex items-center gap-1.5 font-semibold ${isUser ? 'text-indigo-300' : 'text-purple-400'} mb-1">
                    <i class="fa-solid ${isUser ? 'fa-user' : 'fa-robot'} text-[10px]"></i> ${sender}
                </div>
                <div class="leading-relaxed">${text}</div>
            `;
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function switchTab(tab) {
            const preview = document.getElementById("previewContainer");
            const code = document.getElementById("codeView");
            const tabP = document.getElementById("tabPreview");
            const tabC = document.getElementById("tabCode");

            if (tab === 'preview') {
                preview.classList.remove("hidden");
                code.classList.add("hidden");
                tabP.className = "bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 px-3.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 transition";
                tabC.className = "text-slate-400 hover:text-white px-3.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 transition";
            } else {
                preview.classList.add("hidden");
                code.classList.remove("hidden");
                tabC.className = "bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 px-3.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 transition";
                tabP.className = "text-slate-400 hover:text-white px-3.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 transition";
            }
        }

        function clearChat() {
            document.getElementById("chatBox").innerHTML = `
                <div class="bg-slate-800/40 border border-slate-700/50 p-3.5 rounded-2xl text-xs leading-relaxed text-slate-300 backdrop-blur-md">
                    <div class="flex items-center gap-2 mb-1.5 text-indigo-400 font-semibold">
                        <i class="fa-solid fa-robot"></i> LYRAMOON
                    </div>
                    Session reset ho gaya hai! Naya project prompt dein.
                </div>
            `;
            currentCode = "";
            document.getElementById("previewIframe").srcdoc = "";
            document.getElementById("codeView").value = "";
            document.getElementById("downloadBtn").classList.add("hidden");
        }

        async function downloadZip() {
            if (!currentCode) return;
            
            const response = await fetch("/download", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ code: currentCode })
            });

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "TAQI.zip";
            document.body.appendChild(a);
            a.click();
            a.remove();
        }
    </script>
</body>
</html>
