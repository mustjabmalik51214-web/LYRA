<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYRAMOON AI Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 9999px; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-[#090d16] text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="h-16 border-b border-slate-800 px-6 flex justify-between items-center glass-panel">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-pink-500 flex items-center justify-center text-white shadow-lg">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <div>
                <h1 class="text-base font-bold bg-gradient-to-r from-white to-indigo-300 bg-clip-text text-transparent">
                    LYRAMOON <span class="text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 font-semibold uppercase">AI Studio</span>
                </h1>
                <p class="text-[11px] text-slate-400">Created by <span class="text-slate-200">Muhammad Taqi</span></p>
            </div>
        </div>

        <button id="downloadBtn" onclick="downloadZip()" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-xl text-xs transition flex items-center gap-2 shadow-lg shadow-emerald-600/20">
            <i class="fa-solid fa-file-zipper"></i> Download TAQI.zip
        </button>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden p-3 gap-3">
        
        <!-- Chat Panel -->
        <div class="w-full md:w-1/3 lg:w-[380px] glass-panel rounded-2xl flex flex-col overflow-hidden border border-slate-800">
            <div class="p-4 border-b border-slate-800 bg-slate-900/40 flex justify-between items-center">
                <span class="text-xs font-semibold text-slate-300 uppercase tracking-wide flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Assistant Chat
                </span>
                <button onclick="clearChat()" class="text-slate-400 hover:text-white text-xs"><i class="fa-solid fa-rotate-right"></i></button>
            </div>

            <div id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-4">
                <div class="bg-slate-800/40 border border-slate-700/50 p-3.5 rounded-2xl text-xs text-slate-300">
                    <div class="flex items-center gap-1.5 text-indigo-400 font-semibold mb-1"><i class="fa-solid fa-robot"></i> LYRAMOON</div>
                    Salam! Main LYRAMOON hoon. Code request enter karein!
                </div>
            </div>

            <div class="p-3 border-t border-slate-800 bg-slate-900/60">
                <form onsubmit="handleSend(event)" class="relative flex items-center">
                    <input type="text" id="userInput" placeholder="Ask LYRAMOON to build..." class="w-full bg-slate-950 text-slate-100 pl-4 pr-12 py-3 rounded-xl text-xs border border-slate-800 focus:outline-none focus:border-indigo-500">
                    <button type="submit" id="sendBtn" class="absolute right-1.5 bg-indigo-600 hover:bg-indigo-500 text-white w-8 h-8 rounded-lg flex items-center justify-center">
                        <i class="fa-solid fa-arrow-up text-xs"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- Preview & Editor -->
        <div class="flex-1 glass-panel rounded-2xl flex flex-col overflow-hidden border border-slate-800">
            <div class="bg-slate-900/60 border-b border-slate-800 px-4 py-2.5 flex justify-between items-center">
                <div class="flex gap-2">
                    <button id="tabPreview" onclick="switchTab('preview')" class="bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 px-3.5 py-1.5 rounded-lg text-xs font-medium">
                        <i class="fa-solid fa-eye"></i> Live Preview
                    </button>
                    <button id="tabCode" onclick="switchTab('code')" class="text-slate-400 hover:text-white px-3.5 py-1.5 rounded-lg text-xs font-medium">
                        <i class="fa-solid fa-code"></i> Source Code
                    </button>
                </div>
            </div>

            <div class="flex-1 relative bg-[#0b0f19]">
                <div id="previewContainer" class="w-full h-full p-2">
                    <iframe id="previewIframe" class="w-full h-full rounded-xl bg-white"></iframe>
                </div>
                <textarea id="codeView" readonly class="w-full h-full bg-[#0d1117] text-indigo-300 font-mono text-xs p-4 outline-none resize-none hidden"></textarea>
            </div>
        </div>

    </div>

    <script>
        let currentCode = "";

        async function handleSend(e) {
            e.preventDefault();
            const input = document.getElementById("userInput");
            const btn = document.getElementById("sendBtn");
            const prompt = input.value.trim();

            if (!prompt) return;

            appendMessage("User", prompt);
            input.value = "";
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin text-xs"></i>`;

            try {
                const response = await fetch("/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: prompt, current_code: currentCode })
                });

                const data = await response.json();
                
                if (data.success && data.code) {
                    currentCode = data.code;
                    appendMessage("LYRAMOON", data.explanation || "Code updated successfully!");
                    
                    document.getElementById("previewIframe").srcdoc = currentCode;
                    document.getElementById("codeView").value = currentCode;
                    document.getElementById("downloadBtn").classList.remove("hidden");
                } else {
                    appendMessage("LYRAMOON", data.response || "Error generating code.");
                }
            } catch (err) {
                appendMessage("LYRAMOON", "Server error. Check terminal logs.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-arrow-up text-xs"></i>`;
            }
        }

        function appendMessage(sender, text) {
            const chatBox = document.getElementById("chatBox");
            const div = document.createElement("div");
            const isUser = sender === "User";
            div.className = isUser ? "bg-indigo-600/20 border border-indigo-500/30 ml-auto max-w-[85%] p-3 rounded-2xl text-xs text-indigo-100" : "bg-slate-800/40 border border-slate-700/50 mr-auto max-w-[85%] p-3 rounded-2xl text-xs text-slate-300";
            div.innerHTML = `<div class="font-semibold mb-1 text-indigo-400">${sender}</div><div>${text}</div>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function switchTab(tab) {
            const preview = document.getElementById("previewContainer");
            const code = document.getElementById("codeView");
            if (tab === 'preview') {
                preview.classList.remove("hidden");
                code.classList.add("hidden");
            } else {
                preview.classList.add("hidden");
                code.classList.remove("hidden");
            }
        }

        function clearChat() {
            currentCode = "";
            document.getElementById("chatBox").innerHTML = "";
            document.getElementById("previewIframe").srcdoc = "";
            document.getElementById("codeView").value = "";
            document.getElementById("downloadBtn").classList.add("hidden");
        }

        async function downloadZip() {
            if (!currentCode) return;
            const response = await fetch("/download", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ code: currentCode })
            });
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "TAQI.zip";
            a.click();
        }
    </script>
</body>
</html>
