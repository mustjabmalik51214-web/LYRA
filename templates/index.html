<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYRAMOON - AI Code Generator</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <style>
        iframe { width: 100%; height: 100%; border: none; background: white; }
    </style>
</head>
<body class="bg-slate-900 text-white h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-indigo-400">LYRAMOON AI</h1>
            <p class="text-xs text-slate-400">Created by Muhammad Taqi</p>
        </div>
        <button id="downloadBtn" onclick="downloadZip()" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition flex items-center gap-2">
            📥 Download TAQI.zip
        </button>
    </header>

    <!-- Main Content Area -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Chat Panel -->
        <div class="w-1/3 bg-slate-800/50 border-r border-slate-700 flex flex-col">
            <div id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-4">
                <div class="bg-slate-700/50 p-3 rounded-lg text-sm text-slate-300">
                    Hello! Main LYRAMOON hoon. Mujhe batao konsa web application ya code banana hai.
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-4 border-t border-slate-700 bg-slate-800">
                <form id="promptForm" onsubmit="handleSend(event)" class="flex gap-2">
                    <input type="text" id="userInput" placeholder="E.g. Aik hello world website banao with Google link button..." class="flex-1 bg-slate-900 text-white px-3 py-2 rounded-lg text-sm border border-slate-700 focus:outline-none focus:border-indigo-500">
                    <button type="submit" id="sendBtn" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-sm font-medium transition">
                        Send
                    </button>
                </form>
            </div>
        </div>

        <!-- Preview & Code Workspace -->
        <div class="flex-1 flex flex-col bg-slate-950">
            <div class="bg-slate-800 px-4 py-2 text-xs font-semibold text-slate-400 flex gap-4 border-b border-slate-700">
                <button id="tabPreview" onclick="switchTab('preview')" class="text-indigo-400 border-b-2 border-indigo-400 pb-1">Live Preview</button>
                <button id="tabCode" onclick="switchTab('code')" class="text-slate-400 hover:text-white pb-1">Code View</button>
            </div>

            <div class="flex-1 relative">
                <!-- Preview View -->
                <div id="previewContainer" class="w-full h-full">
                    <iframe id="previewIframe"></iframe>
                </div>

                <!-- Code View -->
                <textarea id="codeView" readonly class="w-full h-full bg-slate-950 text-emerald-400 font-mono text-sm p-4 outline-none resize-none hidden"></textarea>
            </div>
        </div>

    </div>

    <script>
        let currentCode = "";

        async function handleSend(e) {
            e.preventDefault();
            const input = document.getElementById("userInput");
            const btn = document.getElementById("sendBtn");
            const prompt = input.value.trim();

            if (!prompt) return;

            appendMessage("User", prompt);
            input.value = "";
            btn.disabled = true;
            btn.innerText = "Generating...";

            try {
                const response = await fetch("/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: prompt, current_code: currentCode })
                });

                const data = await response.json();
                
                if (data.code) {
                    currentCode = data.code;
                    appendMessage("LYRAMOON", data.explanation || "Code updated successfully!");
                    
                    // Render Preview
                    const iframe = document.getElementById("previewIframe");
                    iframe.srcdoc = currentCode;
                    
                    // Update Code View
                    document.getElementById("codeView").value = currentCode;
                    
                    // Show Download Button
                    document.getElementById("downloadBtn").classList.remove("hidden");
                } else {
                    appendMessage("LYRAMOON", data.response || "Something went wrong.");
                }

            } catch (err) {
                appendMessage("LYRAMOON", "Error connecting to server.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Send";
            }
        }

        function appendMessage(sender, text) {
            const chatBox = document.getElementById("chatBox");
            const div = document.createElement("div");
            div.className = sender === "User" 
                ? "bg-indigo-600/30 ml-auto max-w-[80%] p-3 rounded-lg text-sm text-indigo-100" 
                : "bg-slate-700/50 mr-auto max-w-[80%] p-3 rounded-lg text-sm text-slate-300";
            div.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function switchTab(tab) {
            const preview = document.getElementById("previewContainer");
            const code = document.getElementById("codeView");
            const tabP = document.getElementById("tabPreview");
            const tabC = document.getElementById("tabCode");

            if (tab === 'preview') {
                preview.classList.remove("hidden");
                code.classList.add("hidden");
                tabP.className = "text-indigo-400 border-b-2 border-indigo-400 pb-1";
                tabC.className = "text-slate-400 hover:text-white pb-1";
            } else {
                preview.classList.add("hidden");
                code.classList.remove("hidden");
                tabC.className = "text-indigo-400 border-b-2 border-indigo-400 pb-1";
                tabP.className = "text-slate-400 hover:text-white pb-1";
            }
        }

        async function downloadZip() {
            if (!currentCode) return;
            
            const response = await fetch("/download", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ code: currentCode })
            });

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "TAQI.zip";
            document.body.appendChild(a);
            a.click();
            a.remove();
        }
    </script>
</body>
</html>
